name: Hafızlık APK derle

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Hafızlık APK derle
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Kaynak kodlarını indir
        uses: actions/checkout@v4

      - name: Zip dosyasını aç ve projeyi kök dizine yerleştir
        shell: bash
        run: |
          set -euo pipefail
          ZIP=$(ls hafizlik_app*.zip 2>/dev/null | head -n 1 || true)
          if [ -z "$ZIP" ]; then
            echo "::error::Depo kökünde hafizlik_app*.zip dosyası bulunamadı."
            exit 1
          fi
          echo "Zip bulundu: $ZIP"
          rm -rf /tmp/kaynak
          unzip -q "$ZIP" -d /tmp/kaynak
          if [ ! -f /tmp/kaynak/hafizlik_app/pubspec.yaml ]; then
            echo "::error::Zip içinde hafizlik_app/pubspec.yaml bulunamadı."
            exit 1
          fi
                   if [ -f pubspec.yaml ]; then
            echo "Depodaki proje dosyaları kullanılıyor, zip kopyalanmadı."
          else
            cp -a /tmp/kaynak/hafizlik_app/. .
          fi
          test -f tools/android_overlay.py
          echo "Proje dosyaları hazır."

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter kur
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable
          cache: true

      - name: Android platform dosyalarını oluştur
        shell: bash
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name hafizlik_app --org com.hafizlik.app .
          fi

      - name: Android izinlerini, uygulama adını ve desugaring'i ayarla
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          DESUGAR = 'com.android.tools:desugar_jdk_libs:2.0.4'

          # 1) AndroidManifest.xml: izinler, uygulama adı, speech <queries>
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          if not manifest.exists():
              raise SystemExit('AndroidManifest.xml bulunamadı')
          content = manifest.read_text(encoding='utf-8')
          for p in ['INTERNET', 'RECORD_AUDIO', 'ACCESS_COARSE_LOCATION',
                    'ACCESS_FINE_LOCATION', 'POST_NOTIFICATIONS']:
              tag = f'<uses-permission android:name="android.permission.{p}" />'
              if tag not in content:
                  content = re.sub(r'(<manifest\b[^>]*>)', r'\1\n    ' + tag, content, count=1)
          content = re.sub(r'android:label="[^"]*"', 'android:label="Hafızlık"', content, count=1)
          if '<queries>' not in content:
              content = content.replace('</manifest>',
                  '    <queries>\n        <intent>\n'
                  '            <action android:name="android.speech.RecognitionService" />\n'
                  '        </intent>\n    </queries>\n</manifest>')
          manifest.write_text(content, encoding='utf-8')

          # 2) Gradle: core library desugaring (bildirim eklentisi için)
          groovy = Path('android/app/build.gradle')
          kts = Path('android/app/build.gradle.kts')
          if groovy.exists():
              t = groovy.read_text(encoding='utf-8')
              if 'compileOptions {' not in t:
                  t = t.replace('android {', 'android {\n    compileOptions {\n        coreLibraryDesugaringEnabled true\n    }', 1)
              elif 'coreLibraryDesugaringEnabled' not in t:
                  t = t.replace('compileOptions {', 'compileOptions {\n        coreLibraryDesugaringEnabled true', 1)
              if 'coreLibraryDesugaring "' not in t:
                  if re.search(r'^dependencies\s*\{', t, re.M):
                      t = re.sub(r'^dependencies\s*\{', 'dependencies {\n    coreLibraryDesugaring "' + DESUGAR + '"', t, count=1, flags=re.M)
                  else:
                      t += '\ndependencies {\n    coreLibraryDesugaring "' + DESUGAR + '"\n}\n'
              groovy.write_text(t, encoding='utf-8')
          elif kts.exists():
              t = kts.read_text(encoding='utf-8')
              if 'compileOptions {' not in t:
                  t = t.replace('android {', 'android {\n    compileOptions {\n        isCoreLibraryDesugaringEnabled = true\n    }', 1)
              elif 'isCoreLibraryDesugaringEnabled' not in t:
                  t = t.replace('compileOptions {', 'compileOptions {\n        isCoreLibraryDesugaringEnabled = true', 1)
              if 'coreLibraryDesugaring(' not in t:
                  if re.search(r'^dependencies\s*\{', t, re.M):
                      t = re.sub(r'^dependencies\s*\{', 'dependencies {\n    coreLibraryDesugaring("' + DESUGAR + '")', t, count=1, flags=re.M)
                  else:
                      t += '\ndependencies {\n    coreLibraryDesugaring("' + DESUGAR + '")\n}\n'
              kts.write_text(t, encoding='utf-8')
          else:
              raise SystemExit('android/app Gradle dosyası bulunamadı')
          print('Android ayarları tamam.')
          PY

      - name: Namaz vakitleri widget'ını Android projesine ekle
        run: python3 tools/android_overlay.py

      - name: Flutter paketlerini indir
        run: flutter pub get

      - name: Simge ve açılış ekranını oluştur
        run: |
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create

      - name: APK derle
        run: flutter build apk --release

      - name: APK dosyasını yayınla
        uses: actions/upload-artifact@v4
        with:
          name: hafizlik-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
