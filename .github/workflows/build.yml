name: Hafızlık APK derle

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      - name: Android klasörünü oluştur
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name hafizlik_app --org com.hafizlik.app .
          fi

      - name: İzinleri ve uygulama adını ayarla
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          content = manifest.read_text(encoding='utf-8')
          for p in ['INTERNET','RECORD_AUDIO','ACCESS_COARSE_LOCATION',
                    'ACCESS_FINE_LOCATION','POST_NOTIFICATIONS']:
              tag = f'<uses-permission android:name="android.permission.{p}" />'
              if tag not in content:
                  content = re.sub(r'(<manifest\b[^>]*>)', r'\1\n    ' + tag, content, count=1)
          content = re.sub(r'android:label="[^"]*"', 'android:label="Hafızlık"', content, count=1)
          if '<queries>' not in content:
              content = content.replace('</manifest>',
                  '    <queries>\n        <intent>\n'
                  '            <action android:name="android.speech.RecognitionService" />\n'
                  '        </intent>\n    </queries>\n</manifest>')
          manifest.write_text(content, encoding='utf-8')

          gradle = Path('android/app/build.gradle')
          kts = Path('android/app/build.gradle.kts')
          if gradle.exists():
              t = gradle.read_text(encoding='utf-8')
              if 'coreLibraryDesugaringEnabled' not in t:
                  t = t.replace('compileOptions {', 'compileOptions {\n        coreLibraryDesugaringEnabled true', 1)
              if 'coreLibraryDesugaring ' not in t:
                  t = t.replace('dependencies {', 'dependencies {\n    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.0.4"', 1)
              gradle.write_text(t, encoding='utf-8')
          elif kts.exists():
              t = kts.read_text(encoding='utf-8')
              if 'isCoreLibraryDesugaringEnabled' not in t:
                  t = t.replace('compileOptions {', 'compileOptions {\n        isCoreLibraryDesugaringEnabled = true', 1)
              if 'coreLibraryDesugaring(' not in t:
                  t = t.replace('dependencies {', 'dependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.0.4")', 1)
              kts.write_text(t, encoding='utf-8')
          PY

      - name: Namaz widget'ını ekle
        run: python3 tools/android_overlay.py

      - run: flutter pub get

      - name: Simge ve açılış ekranı
        run: |
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create

      - name: APK derle
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: hafizlik-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
