name: Mushaf Yoldaşım V25 çevrimdışı APK derle

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Mushaf Yoldaşım V25 APK derle
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Kaynak kodlarını indir
        uses: actions/checkout@v4

      - name: Proje dosyalarını hazırla ve uyumluluk düzeltmelerini uygula
        shell: bash
        run: |
          set -euo pipefail

          # Her derlemede V11 kaynak paketini aç. Eski V3 kaynaklarını kullanma.
          test -f release_sources/hafizlik-v10-no-model.zip
          echo "ada87980b9acc257c12c061fd447dcbcb0eebbc6779bc30afe59f8f4a6a941be  release_sources/hafizlik-v10-no-model.zip" | sha256sum -c -
          rm -rf lib assets android_overlay tools licenses test
          unzip -oq release_sources/hafizlik-v10-no-model.zip -d .
          test -f release_sources/hafizlik-v11-patch.zip
          echo "e29a5e4e4778c0f1633cdccf5785628db1ea2460a63341c9b51c50b20f34aed9  release_sources/hafizlik-v11-patch.zip" | sha256sum -c -
          unzip -oq release_sources/hafizlik-v11-patch.zip -d .
          test -f release_sources/mushaf-v12-patch.zip
          echo "6495c3a7b050f13d77919b2827130a03b540b94e3676acfa78bdef8d0455f7c3  release_sources/mushaf-v12-patch.zip" | sha256sum -c -
          unzip -oq release_sources/mushaf-v12-patch.zip -d .
          test -f release_sources/mushaf-v13-patch.zip
          echo "bfe5285e42347080c8b9e3b258f1f577a9c3abe6b91bd2856dc14b6960a4c835  release_sources/mushaf-v13-patch.zip" | sha256sum -c -
          unzip -oq release_sources/mushaf-v13-patch.zip -d .
          test -f release_sources/mushaf-v14-patch.zip
          echo "319d0d9a20b8054cbfa2b462bf2b08f1124560c991cfd39dde59c6b006c1fdd3  release_sources/mushaf-v14-patch.zip" | sha256sum -c -
          unzip -oq release_sources/mushaf-v14-patch.zip -d .
          test -f release_sources/mushaf-v14-dart-fix.zip
          echo "6ff332559bff546b41fd126961f40a875882968b0085327b17a360c8325968b0  release_sources/mushaf-v14-dart-fix.zip" | sha256sum -c -
          unzip -oq release_sources/mushaf-v14-dart-fix.zip -d .
          test -f release_sources/mushaf-v15-patch.zip
          echo "761d2adfc23bdf648cd18c2a17c90d1c1411c793d9404c56ac3d09dc36798ba4  release_sources/mushaf-v15-patch.zip" | sha256sum -c -
          unzip -oq release_sources/mushaf-v15-patch.zip -d .
          test -f release_sources/mushaf-v16-patch.zip
          echo "036f38d0a8149aef8014942d58836d934c61150c8184176659a45ce38cd6f202  release_sources/mushaf-v16-patch.zip" | sha256sum -c -
          unzip -oq release_sources/mushaf-v16-patch.zip -d .
          test -f release_sources/mushaf-v17-patch.zip
          echo "24607605275e6a3ba950609ef57682b5722f69a69ac12ef8b5c79aa3cb68c46e  release_sources/mushaf-v17-patch.zip" | sha256sum -c -
          unzip -oq release_sources/mushaf-v17-patch.zip -d .
          python3 release_sources/v18_duzeltme.py
          python3 release_sources/v19_hoca_dinletisi.py
          python3 release_sources/v20_ders_dinlet.py
          # Pin the offline phoneme engine source; bundle only its reference data and model.
          git clone --filter=blob:none --no-checkout https://github.com/alheekmahlib/quran_library.git release_sources/quran_library_upstream
          git -C release_sources/quran_library_upstream checkout bf9d0105b530a1e997e99a5892f3df0091952f3d -- lib/src/tasmee/engine lib/src/tasmee/core/services/tasmee_reference_store.dart assets/quran_lab LICENSE NOTICE
          python3 release_sources/v21_fonem_ders.py
          curl --fail --location --retry 3 --output assets/quran_lab/zipformer_p_arabic_v3.1.int8.onnx https://github.com/alheekmahlib/quran_audio/releases/download/zipformer-model-v1/zipformer_p_arabic_v3.1.int8.onnx
          echo "31755836528da336a6192121cd7bc82cb41752dddb65566fd000b89c8686da6b  assets/quran_lab/zipformer_p_arabic_v3.1.int8.onnx" | sha256sum -c -
          # V17 Hatim ekrani: koleksiyon-if ifadesini acik widget agaci ile duzelt.
          python3 <<'PY'
          from pathlib import Path
          p = Path('lib/hatim/hatim_ekrani.dart')
          data = p.read_text(encoding='utf-8')
          a = data.index('          if (tamam) Card(child: Padding(')
          b = data.index('          else if (bugun >= 0', a)
          replacement = "          if (tamam)\n            Card(\n              child: Padding(\n                padding: const EdgeInsets.all(18),\n                child: Column(\n                  children: [\n                    const Icon(Icons.verified_rounded, size: 25, color: kAltin),\n                    const SizedBox(height: 9),\n                    const Text('Tüm günler tamamlandı!',\n                        style: TextStyle(fontWeight: FontWeight.w800)),\n                    const SizedBox(height: 8),\n                    FilledButton(\n                      onPressed: _yeniHatimOnayi,\n                      child: const Text('Yeni hatime başla'),\n                    ),\n                  ],\n                ),\n              ),\n            )\n"
          p.write_text(data[:a] + replacement + data[b:], encoding='utf-8')
          PY
          # Kitap sayfasi gorunumunde Flutter key parametresini kabul et.
          python3 <<'PY'
          from pathlib import Path
          p = Path('lib/kuran/kuran_okuma_ekrani.dart')
          data = p.read_text(encoding='utf-8')
          old = 'const _SayfaIcerigi({required this.sayfa, required this.onAyetSecildi, this.seciliAyet});'
          new = 'const _SayfaIcerigi({super.key, required this.sayfa, required this.onAyetSecildi, this.seciliAyet});'
          assert data.count(old) == 1, 'Beklenen sayfa yapicisi bulunamadi'
          p.write_text(data.replace(old, new), encoding='utf-8')
          PY
          rm -f lib/ses/turk_ses_arsivi.dart lib/ses/turk_okuyucular_ekrani.dart
          # Kisa Sureler'deki artik bulunmayan Turk okuyucu dalini temizle.
          python3 <<'PY'
          from pathlib import Path
          p = Path('lib/hafizlik/kisa_sureler_ekrani.dart')
          data = p.read_text(encoding='utf-8')
          begin = data.index('  Future<void> _dinle(int no) async {')
          end = data.index('  @override\n  Widget build', begin)
          replacement = '''  Future<void> _dinle(int no) async {
              if (_yukleniyor) return;
              setState(() { _yukleniyor = true; _calanSure = no; });
              try {
                final ayetler = await QuranVeri.tumAyetler();
                final secilen = ayetler.where((a) => a.sure == no).toList();
                await _oynatici.cal(secilen, okuyucular[_okuyucu]);
              } catch (_) {
                if (mounted) ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('Ses başlatılamadı. İnternet bağlantısını veya okuyucuyu kontrol edin.')));
              } finally { if (mounted) setState(() => _yukleniyor = false); }
            }
          
          '''
          p.write_text(data[:begin] + replacement + data[end:], encoding='utf-8')
          PY
          rm -f test/v12_mushaf_yoldasim_test.dart
          # Hatim ekranindaki kapanis parantezini duzelt (V14 derleme hatasi).
          python3 <<'PY'
          from pathlib import Path
          p = Path('lib/hatim/hatim_ekrani.dart')
          data = p.read_text(encoding='utf-8')
          before = "                child: const Text('Yeni hatime başla'))]))"
          after = "                child: const Text('Yeni hatime başla'))])))"
          if before in data:
              p.write_text(data.replace(before, after), encoding='utf-8')
          else:
              print('Hatim ifadesi V17 duzeninde; eski yama atlandi.')
          PY
          # Dua kütüphanesinin Arapça font sabiti (V11 yaması).
          sed -i "/import '..\\/ortak\\/tema.dart';/a import '../ortak/mushaf.dart';" lib/dualar/dualar_ekrani.dart
          test -f pubspec.yaml
          grep -q '^version: 2.8.0+21$' pubspec.yaml
          sed -i 's/^version: 2.8.0+21$/version: 2.8.8+29/' pubspec.yaml
          test -f lib/ders/yerel_kuran_tanima.dart
          echo "Güncel V11 kaynakları açıldı."

          # Model yalnızca APK derlenirken indirilir. APK içinde çevrimdışı çalışır.
          mkdir -p assets/asr
          curl --fail --location --retry 5 --retry-delay 5 --connect-timeout 30 --output assets/asr/model.int8.onnx 'https://huggingface.co/Abdou/quran-asr-small/resolve/main/model.int8.onnx'
          echo "88f9df290d57b8890275d79187b77515aeeb12626a42bc76cbd0f8bfcaff00f0  assets/asr/model.int8.onnx" | sha256sum -c -
          test -f assets/asr/tokens.txt
          echo "Kur'an çevrimdışı tanıma modeli doğrulandı."

          # Düzeltme 1: Flutter 3.35 CardTheme -> CardThemeData
          sed -i 's/cardTheme: CardTheme(/cardTheme: CardThemeData(/' lib/ortak/tema.dart
          grep -q 'cardTheme: CardThemeData(' lib/ortak/tema.dart

          # Düzeltme 2: speech_to_text 6.x eski Registrar API'sini kullanıyor
          sed -i 's/speech_to_text: \^6\.6\.0/speech_to_text: ^7.0.0/' pubspec.yaml
          grep -q 'speech_to_text: ^7.0.0' pubspec.yaml

          # record 5.x ile eski Linux eklentisi arasındaki API uyuşmazlığını gider.
          sed -i 's/record: \^5\.1\.2/record: ^6.2.1/' pubspec.yaml
          grep -q 'record: ^6.2.1' pubspec.yaml

          # V25 accessible shared theme and native countdown widgets.
          python3 <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          p = Path('lib/ortak/tema.dart')
          t = p.read_text()
          t = t.replace('iconSize: 17, minimumSize: const Size(38, 38)', 'iconSize: 22, minimumSize: const Size(48, 48)')
          t = t.replace('height: 61,', 'height: 72,').replace('dense: true,', 'dense: false,')
          t = t.replace('Color(0xFFF2EBDD)', 'Color(0xFFF4F7F5)').replace('Color(0xFFFCF7ED)', 'Color(0xFFFFFFFF)')
          p.write_text(t)
          for name in ['vakit_widget', 'vakit_widget_genis', 'vakit_widget_kompakt']:
              p = Path('android_overlay/res/layout/' + name + '.xml')
              t = p.read_text()
              assert '</LinearLayout>' in t
              t = t.replace('</LinearLayout>', '    <Chronometer android:id="@+id/geri_sayim" android:layout_width="match_parent" android:layout_height="wrap_content" android:textColor="#FFEBD9A4" android:textSize="12sp" android:singleLine="true" />\n</LinearLayout>')
              if name == 'vakit_widget_kompakt':
                  t = t.replace('android:padding="16dp"', 'android:padding="8dp"')
              elif name == 'vakit_widget_genis':
                  t = t.replace('android:maxLines="3"', 'android:maxLines="4"')
              ET.fromstring(t)
              p.write_text(t)
          p = Path('android_overlay/kotlin/VakitWidgetProvider.kt')
          t = p.read_text().replace('it.first >= now - 60000L', 'it.first > now')
          marker = '        views.setTextViewText(R.id.satirlar, summary)'
          assert marker in t
          t = t.replace(marker, marker + '''
                  if (next != null && Build.VERSION.SDK_INT >= 24) {
                      views.setViewVisibility(R.id.geri_sayim, android.view.View.VISIBLE)
                      views.setChronometer(R.id.geri_sayim, android.os.SystemClock.elapsedRealtime() + (next.first - now), "Kalan %s", true)
                      views.setChronometerCountDown(R.id.geri_sayim, true)
                  } else {
                      views.setViewVisibility(R.id.geri_sayim, android.view.View.GONE)
                  }''')
          p.write_text(t)
          PY

          # V11 tasariminda renk tanimlari derleme uyumludur.
          test -f tools/android_overlay.py
          echo "Proje hazır ve düzeltmeler uygulandı."

      - name: Güncel birleştirilmiş kaynakları inceleme için sakla
        uses: actions/upload-artifact@v4
        with:
          name: mushaf-v25-merged-source
          path: |
            lib/
            test/
            tools/
            android_overlay/
            pubspec.yaml
          retention-days: 3
          if-no-files-found: error

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter kur
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable
          cache: true

      - name: Android platform dosyalarını oluştur
        shell: bash
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name hafizlik_app --org com.hafizlik.app .
          fi

      - name: Android izinlerini, uygulama adını ve desugaring'i ayarla
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          DESUGAR = 'com.android.tools:desugar_jdk_libs:2.0.4'

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          if not manifest.exists():
              raise SystemExit('AndroidManifest.xml bulunamadı')
          content = manifest.read_text(encoding='utf-8')
          for p in ['INTERNET', 'RECORD_AUDIO', 'ACCESS_COARSE_LOCATION',
                    'ACCESS_FINE_LOCATION', 'POST_NOTIFICATIONS']:
              tag = f'<uses-permission android:name="android.permission.{p}" />'
              if tag not in content:
                  content = re.sub(r'(<manifest\b[^>]*>)', r'\1\n    ' + tag, content, count=1)
          content = re.sub(r'android:label="[^"]*"', 'android:label="Mushaf Yoldaşım"', content, count=1)
          if '<queries>' not in content:
              content = content.replace('</manifest>',
                  '    <queries>\n        <intent>\n'
                  '            <action android:name="android.speech.RecognitionService" />\n'
                  '        </intent>\n    </queries>\n</manifest>')
          manifest.write_text(content, encoding='utf-8')

          groovy = Path('android/app/build.gradle')
          kts = Path('android/app/build.gradle.kts')
          if groovy.exists():
              t = groovy.read_text(encoding='utf-8')
              if 'compileOptions {' not in t:
                  t = t.replace('android {', 'android {\n    compileOptions {\n        coreLibraryDesugaringEnabled true\n    }', 1)
              elif 'coreLibraryDesugaringEnabled' not in t:
                  t = t.replace('compileOptions {', 'compileOptions {\n        coreLibraryDesugaringEnabled true', 1)
              if 'coreLibraryDesugaring "' not in t:
                  if re.search(r'^dependencies\s*\{', t, re.M):
                      t = re.sub(r'^dependencies\s*\{', 'dependencies {\n    coreLibraryDesugaring "' + DESUGAR + '"', t, count=1, flags=re.M)
                  else:
                      t += '\ndependencies {\n    coreLibraryDesugaring "' + DESUGAR + '"\n}\n'
              groovy.write_text(t, encoding='utf-8')
          elif kts.exists():
              t = kts.read_text(encoding='utf-8')
              if 'compileOptions {' not in t:
                  t = t.replace('android {', 'android {\n    compileOptions {\n        isCoreLibraryDesugaringEnabled = true\n    }', 1)
              elif 'isCoreLibraryDesugaringEnabled' not in t:
                  t = t.replace('compileOptions {', 'compileOptions {\n        isCoreLibraryDesugaringEnabled = true', 1)
              if 'coreLibraryDesugaring(' not in t:
                  if re.search(r'^dependencies\s*\{', t, re.M):
                      t = re.sub(r'^dependencies\s*\{', 'dependencies {\n    coreLibraryDesugaring("' + DESUGAR + '")', t, count=1, flags=re.M)
                  else:
                      t += '\ndependencies {\n    coreLibraryDesugaring("' + DESUGAR + '")\n}\n'
              kts.write_text(t, encoding='utf-8')
          else:
              raise SystemExit('android/app Gradle dosyası bulunamadı')
          print('Android ayarları tamam.')
          PY

      - name: Namaz vakitleri widget'ını Android projesine ekle
        run: python3 tools/android_overlay.py

      - name: Flutter paketlerini indir
        run: flutter pub get

      - name: Simge ve açılış ekranını oluştur
        run: |
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create

      - name: V11 dua ve ses testleri
        run: |
          flutter test test/v11_dualar_ve_turkce_ses_test.dart
          flutter test test/v13_turk_okuyucu_ve_tasarim_test.dart
          flutter test test/v14_uygulama_test.dart
          flutter test test/v15_meal_ve_sayfa_test.dart
          flutter test test/v15_mushaf_gecis_test.dart
          flutter test test/karsilastirma_test.dart
          flutter test test/v16_sirali_dinlet_ve_okuyucu_test.dart
          flutter test test/v16_kitap_sayfasi_test.dart
          flutter test test/v17_tasarim_sayfa_cevirme_test.dart
          flutter test test/v19_hoca_dinletisi_test.dart
          flutter test test/v20_ders_dinlet_test.dart

      - name: APK derle
        run: flutter build apk --release

      - name: Kalıcı uygulama anahtarı ile APK imzala ve doğrula
        id: sign_apk
        shell: bash
        env:
          MUSHAF_KEYSTORE_BASE64: ${{ secrets.MUSHAF_KEYSTORE_BASE64 }}
          MUSHAF_KEYSTORE_PASSWORD: ${{ secrets.MUSHAF_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          if [[ -z "$MUSHAF_KEYSTORE_BASE64" || -z "$MUSHAF_KEYSTORE_PASSWORD" ]]; then
            echo "::error::Kalıcı imzalama için MUSHAF_KEYSTORE_BASE64 ve MUSHAF_KEYSTORE_PASSWORD Actions secrets tanımlanmalıdır."
            exit 1
          fi
          KEYSTORE="$(mktemp)"
          trap 'rm -f "$KEYSTORE"' EXIT
          printf '%s' "$MUSHAF_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          unset MUSHAF_KEYSTORE_BASE64
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:?Android SDK bulunamadı}}"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          APK=build/app/outputs/flutter-apk/app-release.apk
          SIGNED=build/app/outputs/flutter-apk/app-release-signed.apk
          "$APKSIGNER" sign --ks "$KEYSTORE" --ks-key-alias mushaf-upload \
            --ks-pass env:MUSHAF_KEYSTORE_PASSWORD --key-pass env:MUSHAF_KEYSTORE_PASSWORD \
            --v1-signing-enabled false --v2-signing-enabled true \
            --out "$SIGNED" "$APK"
          "$APKSIGNER" verify --verbose --print-certs "$SIGNED" | tee "$RUNNER_TEMP/mushaf-signature.txt"
          grep -Fqi '3712f0d441816e23cfdd06b5a5fd09e9c79c8f7fea580ebf61bf1ca62c68c8e1' "$RUNNER_TEMP/mushaf-signature.txt"
          mv "$SIGNED" "$APK"

      # Keep the release gate intact. If repository secrets are absent,
      # retain a clearly distinguished input for private local signing only.
      - name: Yerel imzalama için derleme çıktısını hazırla
        if: ${{ failure() && steps.sign_apk.outcome == 'failure' }}
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:?Android SDK bulunamadı}}"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          mkdir -p "$RUNNER_TEMP/mushaf-local-sign"
          cp build/app/outputs/flutter-apk/app-release.apk "$RUNNER_TEMP/mushaf-local-sign/NOT-FOR-INSTALL.apk"
          cp "$(dirname "$APKSIGNER")/lib/apksigner.jar" "$RUNNER_TEMP/mushaf-local-sign/apksigner.jar"
          printf '%s\n' 'Ara derleme dosyası. Kalıcı sertifika ile imzalanıp doğrulanmadan KURMAYIN.' > "$RUNNER_TEMP/mushaf-local-sign/README.txt"

      - name: Yalnızca yerel imzalama girdisini sakla
        if: ${{ failure() && steps.sign_apk.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: mushaf-yoldasim-v25-local-signing-input-NOT-FOR-INSTALL
          path: ${{ runner.temp }}/mushaf-local-sign/
          if-no-files-found: error
          retention-days: 3

      - name: APK dosyasını yayınla
        uses: actions/upload-artifact@v4
        with:
          name: mushaf-yoldasim-v25-ci-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
